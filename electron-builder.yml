# electron-builder 설정 (PoC — 서명 없음)
appId: com.closedcode.desktop
productName: Closed Code Desktop
copyright: SKCC

directories:
  output: release
  buildResources: build

# 패키징 대상: 컴파일된 메인(dist-electron) + 렌더러 번들(dist) + 매니페스트.
# 소스 .ts 와 테스트 산출물은 뺀다. (ws 등 production 의존성은 electron-builder 가 자동 포함)
files:
  - dist-electron/**/*
  - dist/**/*
  - package.json
  - build/icon.png # OS 알림 아이콘 (taskNotifier 가 런타임에 읽는다)
  - '!dist-electron/**/*.test.js'
  - '!dist-electron/src/**/*'
  - '!dist-electron/tests/**/*'
  - '!**/*.map'

asar: true

# opencode 실행 파일을 앱 안에 싣는다 — **폐쇄망 현장에는 npm·bun·curl 이 없다.**
# `scripts/fetch-opencode.mjs` 가 `build/vendor/opencode/<타깃>/` 에 받아 두고
# (레포에는 안 들어간다 — 137MB, gitignore), 런타임 탐색은 `electron/opencode/binary.ts`.
#
# ⚠️ **`${platform}` 이 아니라 `${os}` 다.** `${platform}` 은 `process.platform` — 즉
# **빌드하는 머신**을 돌려준다(`app-builder-lib/out/util/macroExpander.js:34`, 실측).
# 맥에서 `--win` 을 말면 `darwin` 이 박혀 빈 자리를 가리킨다. `${os}` 는 타깃 쪽
# 키(`mac`/`win`/`linux`)다.
#
# `${arch}` 는 아키마다 다시 펼쳐진다 — 매처가 arch 별로 만들어지기 때문이다
# (`platformPackager.js:201`). 그래서 mac zip 두 개에 **각자 것만** 실린다 (dist 로 실측).
#
# `to: opencode` 로 평탄하게 놓아 런타임 경로가 아키와 무관해진다:
#   mac  Contents/Resources/opencode/opencode
#   win  resources/opencode/opencode.exe
extraResources:
  - from: build/vendor/opencode/${os}-${arch}
    to: opencode

mac:
  target:
    - target: zip
      arch: [arm64, x64] # Apple Silicon + Intel
  category: public.app-category.developer-tools
  icon: build/icon.icns
  identity: null # PoC: 코드 서명 없음

win:
  target:
    - target: nsis
      arch: [x64]
  # .ico 가 없으면 electron-builder 가 icon.png(1024px)에서 자동 변환한다
  # 코드 서명은 mac 과 마찬가지로 안 한다 (인증서 미설정 시 electron-builder 가 자동 생략)
  icon: build/icon.png

# 버전 없는 이름으로 고정 → releases/latest/download 로 항상 최신을 받게 한다.
artifactName: closed-code-desktop-${arch}.${ext}
