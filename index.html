<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      frame-src code-ext: — 확장 화면을 담는 iframe 만 허용한다.
      default-src 'self' 로 두면 커스텀 스킴 프레임이 막힌다.

      확장 화면을 srcdoc 으로 넣지 않는 이유가 여기 있다: srcdoc 문서는 **이 정책을 물려받아**
      인라인 스크립트가 통째로 죽는다(script-src 가 없어 default-src 'self' 로 떨어진다).
      그래서 URL 로 서빙하고, 그 문서는 자기 CSP 를 갖는다 —
      electron/extensions/viewHost.ts · src/state/extensionHtmlDoc.ts.

      ⚠️ 확장 때문에 이 정책에 'unsafe-inline'(script) 을 더하지 말 것.
      앱 전체의 방어를 확장 하나 때문에 여는 것이라 값이 맞지 않는다.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src code-ext:"
    />
    <title>Closed Code Desktop</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
